services:
  - type: web
    name: todo-api-flask
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn src.app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        value: sqlite:///data/tasks.db
    disks:
      - name: sqlite-data
        mountPath: /opt/render/project/src/data
        sizeGB: 1
      